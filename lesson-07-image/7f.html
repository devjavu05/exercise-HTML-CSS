<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin-top: 0;
            margin-bottom: 0;
            font-family: Arial;
            color: grey;
            font-size: 10px;
        }
        .email{
            margin-bottom: 5px;
        }
        .info{
            margin-top: 10px;
            margin-bottom: 10px;
        }
        input{
            width: 240px;
        }
        button{
            border: none;
            color: white;
            background-color: rgb(10, 102, 194);
            font-size: 10px;
            border-radius: 20px;
            padding-bottom: 10px;
            padding-top: 10px;
            padding-left: 90px;
            padding-right: 90px;
        }
    </style>
</head>
<body>
    <p class="email">Email</p>
    <input type="text">
    <p class="info">By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button>Agree & Join</button>
</body>
</html>
