<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 50px;
            height: 50px;
            border-radius: 50px ;
            object-fit: cover;
            vertical-align: middle;
        }
        input{
            color: grey;
            font-size: 12px;
            vertical-align: middle;
            border: none;
            margin-right: 20px;
        }
        button{
            color: white;
            background-color: rgb(28, 28, 238);
            opacity: 0.6;
            border: none;
            border-radius: 10px;
            vertical-align: middle;
            font-size: 10px;
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 5px;
            padding-right: 5px;
        }

    </style>
</head>
<body>
    <img src="cat.jpg">
    <input type="text" placeholder="What's happening?">
    <button>Tweet</button>
</body>
</html>
