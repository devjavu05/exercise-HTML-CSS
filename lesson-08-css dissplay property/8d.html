<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    input{
      border-radius: 10px;
      border: solid;
      border-width: 1px;
      border-color: rgb(197, 194, 194);
      padding-left: 10px;
      padding-top: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .input1,
    .input2{
      width: 130px;
    }
    .input3{
      display: block;
      width: 280px;
    }
    button{
      width: 290px;
      margin-left: 2px;
      color: white;
      background-color: rgb(47, 127, 231);
      font-size: 14px;
      border: none;
      border-radius: 10px;
      padding-top: 10px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
    <input class="input1" type="text" placeholder="First name">
    <input class="input2" type="text" placeholder="Last name">
    <input class="input3" type="text" placeholder="Email">
    <button>Sign Up</button>
</body>
</html>
