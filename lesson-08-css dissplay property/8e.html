<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      color: black;
      font-size: 26px;
    }
    input{
      display: block;
      margin-bottom: 5px;
      border: none;
      padding-bottom: 5px;
      padding-top: 5px;
      padding-left: 10px;
      width: 240px;
      height: 20px;
      font-size: 12px;
      background-color: rgb(231, 223, 223);
    }
    .nut2{
      margin-bottom: 20px;
    }
    button{
        padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-right: 10px;
      margin-right: 10px;
    }
    .button-1{
      border: none;
      background-color: black;
      color: white;

    }
    .button-2{
      border: none;
    }
  </style>
</head>
<body>
  <p class="text-1">Request a ride now</p>
  <input type="text" placeholder="Enter pickup location">
  <input class="nut2" type="text" placeholder="Enter destination">
  <button class="button-1">Request now</button>
  <button class="button-2">Schedule for later</button>
</body>
</html>
