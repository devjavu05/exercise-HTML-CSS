<style>
  button {
    color: white;
    background-color: green;
    border: none;
    padding: 5px 15px 5px 15px;
     margin-left: 10px;
     margin-right: 10px;

        transition: padding 0.15s,
      margin 0.15s;
  }
  button:hover {
    padding-left: 20px;
    padding-right: 20px;
    margin-right: 5px;
    margin-left: 5px;
    
  }
</style>
<button class="button-1">One</button>
<button>Two</button>
<button>Three</button>
<br>

Quy tắc chung: padding tăng thêm bao nhiêu thì margin phải giảm đúng bấy nhiêu.
 Ở đây padding tăng từ 15 lên 20, tức là +5, nên margin giảm từ 10 xuống 5, tức là −5.
